<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>הצעת מחיר</title>
<style>
:root{--ac:#1f3a5f;--ac2:#e9c46a;--bg:#f5f6f8;--card:#fff;--tx:#17202b;--mu:#6b7684;--ln:#e4e7ec;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Heebo,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 120px}
.hero{background:var(--ac);color:#fff;border-radius:22px;padding:22px 20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:var(--ac2);opacity:.18}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:54px;max-width:160px;object-fit:contain;background:#fff;border-radius:12px;padding:6px}
.brand b{font-size:18px}.brand small{display:block;opacity:.8;font-size:13px}
.hero h1{font-size:24px;margin:18px 0 4px;line-height:1.25}.hero .meta{opacity:.85;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:10px}
.card{background:var(--card);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h2{font-size:17px;margin:0 0 10px}
.it{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}.it:first-of-type{border-top:0}
.it b{display:block}.it small{color:var(--mu);display:block}.it .p{text-align:left;white-space:nowrap;font-weight:700}
.inc{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.inc i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:13px}
.tot{display:flex;justify-content:space-between;padding:6px 0;color:var(--mu)}.tot.big{color:var(--tx);font-size:20px;font-weight:800;border-top:2px solid var(--tx);margin-top:6px;padding-top:12px}
.terms{white-space:pre-wrap;font-size:14px;color:#3a4552}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;background:#fff}
canvas{width:100%;height:180px;border:1.5px dashed #b8c0cc;border-radius:14px;background:#fff;touch-action:none;display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--ac);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:#eef1f5;color:var(--tx)}.btn.wa{background:#25d366;color:#08331a}.btn.full{width:100%;font-size:17px}
.muted{color:var(--mu);font-size:13px}
.signed{border:2px solid var(--ok)}.signed img{max-width:260px;height:90px;object-fit:contain;display:block;margin-top:8px}
.bar{position:fixed;bottom:0;right:0;left:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}.bar .in .t{flex:1}.bar .in .t b{font-size:18px}
.center{text-align:center;padding:60px 20px}
@media print{.bar,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid var(--ln)}.wrap{padding:0}}
</style></head><body>
<div class="wrap" id="app"><div class="center muted">טוען את ההצעה…</div></div>
<script>
const FN='https://tcnnmbmooynevstasgaj.supabase.co/functions/v1/os-quote';
const KEY='sb_publishable_qOxby8FAtaYFziBdLXIuUg_WB5Kp7lQ';
const P=new URLSearchParams(location.search), T=P.get('t')||'', PREVIEW=P.get('preview')==='1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ils=n=>'₪'+(+n||0).toLocaleString('he-IL',{minimumFractionDigits:0,maximumFractionDigits:2});
const d=s=>s?new Date(s).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'}):'';
async function call(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({t:T,...body})});const j=await r.json();if(!r.ok)throw new Error(j.error||'error');return j;}
let Q,B;
function totals(){const sub=(Q.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.p||0),0);const disc=+Q.discount||0;const net=sub-disc;const vat=net*(+Q.vat_pct||0)/100;return {sub,disc,net,vat,total:net+vat};}
function view(){
  const t=totals(); const r=document.documentElement.style; if(B.color) r.setProperty('--ac',B.color); if(B.accent) r.setProperty('--ac2',B.accent);
  const open=['sent','viewed'].includes(Q.status);
  const waPhone=(B.whatsapp||B.phone||'').replace(/\D/g,'').replace(/^0/,'972');
  document.title=`הצעת מחיר #${Q.number} · ${B.name||''}`;
  document.getElementById('app').innerHTML=`
  <div class="hero"><div class="brand">${B.logo?`<img src="${esc(B.logo)}" alt="">`:''}<div><b>${esc(B.name||'')}</b><small>${esc(B.tagline||'')}</small></div></div>
    <h1>${esc(Q.title||'הצעת מחיר')}</h1>
    <div class="meta">עבור ${esc(Q.client_company||Q.client_name||'')}${Q.client_company&&Q.client_name?` · ${esc(Q.client_name)}`:''}<br>הצעה מס׳ ${Q.number} · ${d(Q.sent_at||Q.created_at)}${Q.valid_until?` · בתוקף עד ${d(Q.valid_until)}`:''}</div>
    <span class="pill">${{sent:'ממתינה לאישורך',viewed:'ממתינה לאישורך',signed:'✓ אושרה ונחתמה',declined:'נדחתה',expired:'פג תוקף ההצעה',draft:'טיוטה (תצוגה מקדימה)'}[Q.status]||''}</span></div>
  ${Q.intro?`<div class="card"><div style="white-space:pre-wrap">${esc(Q.intro)}</div></div>`:''}
  ${(Q.includes||[]).length?`<div class="card"><h2>מה מקבלים</h2>${Q.includes.map(x=>`<div class="inc"><i>✓</i><span>${esc(x)}</span></div>`).join('')}</div>`:''}
  <div class="card"><h2>פירוט ההצעה</h2>${(Q.lines||[]).map(l=>`<div class="it"><div><b>${esc(l.d)}</b>${l.details?`<small>${esc(l.details)}</small>`:''}<small>${(+l.qty||0).toLocaleString('he-IL')} × ${ils(l.p)}</small></div><div class="p">${ils((+l.qty||0)*(+l.p||0))}</div></div>`).join('')}
    <div style="margin-top:10px"><div class="tot"><span>סכום ביניים</span><span>${ils(t.sub)}</span></div>${t.disc?`<div class="tot"><span>הנחה</span><span>−${ils(t.disc)}</span></div>`:''}${+Q.vat_pct?`<div class="tot"><span>מע״מ ${+Q.vat_pct}%</span><span>${ils(t.vat)}</span></div>`:''}<div class="tot big"><span>סה״כ לתשלום</span><span>${ils(t.total)}</span></div></div></div>
  ${Q.terms?`<div class="card"><h2>תנאים</h2><div class="terms">${esc(Q.terms)}</div></div>`:''}
  ${Q.status==='signed'?`<div class="card signed"><h2>✓ ההצעה אושרה</h2><div>נחתמה על ידי <b>${esc(Q.signer_name)}</b>${Q.signer_role?` (${esc(Q.signer_role)})`:''} ב-${new Date(Q.signed_at).toLocaleString('he-IL')}</div>${Q.signature_url?`<img src="${esc(Q.signature_url)}" alt="חתימה">`:''}</div>`:''}
  ${open&&!PREVIEW?`<div class="card noprint" id="sign"><h2>אישור וחתימה</h2><div class="muted">חתימה כאן מאשרת את ההצעה כפי שהיא מופיעה למעלה.</div>
    <label>שם מלא</label><input type="text" id="sn" autocomplete="name"><label>תפקיד / חברה (לא חובה)</label><input type="text" id="sr">
    <label>חתימה</label><canvas id="pad"></canvas><div class="row" style="margin-top:6px"><button class="btn ghost" id="clr" type="button">ניקוי</button><span class="muted">לחתום עם האצבע או העכבר</span></div>
    <label style="display:flex;gap:10px;align-items:flex-start;font-weight:400"><input type="checkbox" id="ok" style="width:20px;height:20px;margin-top:2px"> קראתי ואני מאשר/ת את ההצעה ואת התנאים</label>
    <button class="btn full" id="go" style="margin-top:10px">✍️ חתימה ואישור ההצעה</button>
    <div style="text-align:center;margin-top:12px"><a href="#" id="dec" class="muted">לא מתאים לנו כרגע</a></div><div id="msg" class="muted" style="margin-top:8px"></div></div>`:''}
  <div class="card noprint"><div class="row">${waPhone?`<a class="btn wa" href="https://wa.me/${waPhone}?text=${encodeURIComponent(`שלום, יש לי שאלה לגבי הצעת מחיר מס׳ ${Q.number}`)}">💬 שאלה בוואטסאפ</a>`:''}${B.phone?`<a class="btn ghost" href="tel:${esc(B.phone)}">📞 ${esc(B.phone)}</a>`:''}<button class="btn ghost" onclick="print()">⬇️ שמירה כ-PDF</button></div>
  <div class="muted" style="margin-top:10px">${[B.address,B.email,B.site,B.taxId?'ע.מ/ח.פ '+B.taxId:''].filter(Boolean).map(esc).join(' · ')}</div></div>
  ${open&&!PREVIEW?`<div class="bar"><div class="in"><div class="t"><div class="muted">סה״כ כולל מע״מ</div><b>${ils(t.total)}</b></div><a class="btn" href="#sign">לאישור ההצעה</a></div></div>`:''}`;
  if(open&&!PREVIEW) pad();
}
function pad(){
  const c=document.getElementById('pad'),x=c.getContext('2d');let dr=false,has=false;
  const fit=()=>{const r=c.getBoundingClientRect(),k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;x.scale(k,k);x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b1a33';};fit();
  const pt=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  c.onpointerdown=e=>{dr=true;has=true;c.setPointerCapture(e.pointerId);const [a,b]=pt(e);x.beginPath();x.moveTo(a,b);};
  c.onpointermove=e=>{if(!dr)return;const [a,b]=pt(e);x.lineTo(a,b);x.stroke();};
  c.onpointerup=c.onpointercancel=()=>dr=false;
  document.getElementById('clr').onclick=()=>{x.clearRect(0,0,c.width,c.height);has=false;};
  document.getElementById('go').onclick=async()=>{const m=document.getElementById('msg');const name=document.getElementById('sn').value.trim();
    if(name.length<2) return m.textContent='נא למלא שם מלא'; if(!has) return m.textContent='נא לחתום במסגרת'; if(!document.getElementById('ok').checked) return m.textContent='נא לסמן אישור';
    const g=document.getElementById('go'); g.disabled=true; g.textContent='שולח…';
    try{const r=await call({mode:'sign',name,role:document.getElementById('sr').value,accept:true,signature:c.toDataURL('image/png')});Object.assign(Q,{status:'signed',signer_name:name,signer_role:document.getElementById('sr').value,signed_at:r.signed_at,signature_url:r.signature_url});view();scrollTo(0,0);}
    catch(e){m.textContent='החתימה לא נשמרה: '+e.message;g.disabled=false;g.textContent='✍️ חתימה ואישור ההצעה';}};
  document.getElementById('dec').onclick=async e=>{e.preventDefault();const reason=prompt('אפשר לספר לנו למה? (לא חובה)')||'';try{await call({mode:'decline',reason});Q.status='declined';view();}catch(err){}};
}
(async()=>{try{const r=await call({mode:'get',preview:PREVIEW});Q=r.quote;B=r.biz||{};view();}catch(e){document.getElementById('app').innerHTML='<div class="center"><h2>ההצעה לא נמצאה</h2><div class="muted">ייתכן שהקישור שגוי. אפשר לפנות אלינו ישירות.</div></div>';}})();
</script></body></html>
