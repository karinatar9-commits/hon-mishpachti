<!doctype html><meta charset="utf-8"><title>xfer</title><body>sending…<script>
// Hands published media files to the opener window (used to upload posts to Instagram web from automation).
// ?f=<url>&f=<url>... -> postMessage({xfer: File, xfers: [File...]})
const q=new URLSearchParams(location.search), srcs=q.getAll('f'), to=q.get('to')||'https://www.instagram.com';
Promise.all(srcs.map(s=>fetch(s).then(r=>r.blob()).then(b=>new File([b],s.split('/').pop(),{type:b.type&&b.type!=='application/octet-stream'?b.type:(/\.jpe?g$/i.test(s)?'image/jpeg':/\.png$/i.test(s)?'image/png':'video/mp4')}))))
.then(fs=>{window.opener.postMessage({xfer:fs[0],xfers:fs},to);document.body.textContent='sent '+fs.length;setTimeout(()=>window.close(),1500)}).catch(e=>document.body.textContent='err '+e);
</script>
