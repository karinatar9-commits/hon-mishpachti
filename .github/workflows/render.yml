name: Karin OS — רינדור סרטונים
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: karin-os-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: os/render
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
      - name: Install narration voice (edge-tts)
        run: pipx install edge-tts || pip install --user edge-tts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-23
      - name: Install
        working-directory: os/render
        run: npm install --no-audit --no-fund --silent
      - name: Render queue
        working-directory: os/render
        env:
          WORKER_MINUTES: '9'
        run: node worker.mjs
